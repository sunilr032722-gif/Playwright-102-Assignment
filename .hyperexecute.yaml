---
version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: linux
autosplit: true
retryOnFailure: false
maxRetries: 1
concurrency: 2

pre:
  - npm install
  - npx playwright install --with-deps chromium

testDiscovery:
  type: raw
  mode: remote
  command: grep -nri 'describe' tests | sed 's/:test.*//'

testRunnerCommand: npx playwright test $test

report: true
partialReports:
  frameworkName: playwright
  location: playwright-report
  type: HTML

uploadArtefacts:
  - name: PlaywrightArtifacts
    path:
      - playwright-report/**
      - test-results/**
