version: "0.2"
runson: linux

# Configure LT_USERNAME and LT_ACCESS_KEY as encrypted HyperExecute secrets.
# Confirm the supported browser/OS matrix in your HyperExecute account before expanding it.
autosplit: true
concurrency: 2

cache:
  enabled: true
  paths:
    - node_modules

pre:
  - npm ci
  - npx playwright install --with-deps chromium

test:
  - npm test

mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**

post:
  - echo "Playwright 102 execution finished. Review the uploaded artifacts."
