name: HyperExecute

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download HyperExecute CLI
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://downloads.lambdatest.com/hyperexecute/linux/hyperexecute \
            --output hyperexecute
          chmod +x hyperexecute

      - name: Run HyperExecute matrix
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          test -n "$LT_USERNAME" || { echo "Missing LT_USERNAME repository secret"; exit 1; }
          test -n "$LT_ACCESS_KEY" || { echo "Missing LT_ACCESS_KEY repository secret"; exit 1; }
          ./hyperexecute \
            --user "$LT_USERNAME" \
            --key "$LT_ACCESS_KEY" \
            --config hyperexecute.yaml \
            --download-artifacts-zip
